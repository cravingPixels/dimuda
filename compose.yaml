# Required .env variables:
# PUID, PGID, TZ, APP_DIR, DOMAIN, DIMUDA_SUBDOMAIN, DIMUDA_NAME
# STACKS_READ_GID
# DOCKGE_STACKS_DIR, KOMODO_STACKS_DIR
# GIT_REPOS, GIT_TOKEN, GITHUB_TOKEN               ← never commit tokens
# NTFY_URL, NTFY_TOPIC, NTFY_TOKEN                 ← never commit token
# See .env.example for full template.
#
# Depends on docker-socket-proxy (CONTAINERS=1, IMAGES=1) and traefik stacks being up.
# Compose folders are mounted read-only; their .env files are read only to resolve ${VAR} in image names.

name: dimuda

services:
  dimuda:
    image: ghcr.io/cravingpixels/dimuda:${DIMUDA_VERSION:-latest}
    container_name: dimuda
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Starts as root to create and chown ${APP_DIR}/data, then permanently switches to PUID:PGID.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      STACKS_READ_GID: ${STACKS_READ_GID}
      TZ: ${TZ}
      COMPOSE_DIRS: dockge=/stacks/dockge,komodo=/stacks/komodo
      GIT_REPOS: ${GIT_REPOS:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DOCKER_HOST: tcp://dockerproxy:2375
      SCAN_INTERVAL: ${DIMUDA_SCAN_INTERVAL:-6h}
      PUBLIC_URL: https://${DIMUDA_SUBDOMAIN}.${DOMAIN}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - ${APP_DIR}/data:/data
      - ${DOCKGE_STACKS_DIR}:/stacks/dockge:ro
      - ${KOMODO_STACKS_DIR}:/stacks/komodo:ro
    tmpfs:
      - /tmp
    networks:
      - traefik-net
      - docker-socket-proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-net
      traefik.http.routers.dimuda.entrypoints: https
      traefik.http.routers.dimuda.rule: Host(`${DIMUDA_SUBDOMAIN}.${DOMAIN}`)
      traefik.http.routers.dimuda.tls: "true"
      traefik.http.routers.dimuda.tls.certresolver: cloudflare
      traefik.http.services.dimuda.loadbalancer.server.port: "8080"
      homepage.group: Infra
      homepage.name: ${DIMUDA_NAME}
      homepage.icon: sh-docker.svg
      homepage.href: https://${DIMUDA_SUBDOMAIN}.${DOMAIN}
      homepage.description: Container image updates
      kuma.enable: "true"
      kuma.dimuda.keyword.name: ${DIMUDA_NAME}
      kuma.dimuda.keyword.url: https://${DIMUDA_SUBDOMAIN}.${DOMAIN}/
      kuma.dimuda.keyword.keyword: dimuda
    read_only: true
    mem_swappiness: 0
    deploy:
      # TODO: tune after profiling
      resources:
        limits:
          cpus: "0.50"
          memory: 256m
        reservations:
          cpus: "0.10"
          memory: 64m

networks:
  traefik-net:
    external: true
  docker-socket-proxy:
    external: true
