# Required .env variables:
# TZ, APP_DIR, DOMAIN, UPDATES_SUBDOMAIN, UPDATES_NAME
# DOCKGE_STACKS_DIR, KOMODO_STACKS_DIR
# GIT_REPOS, GIT_TOKEN, GITHUB_TOKEN               ← never commit tokens
# NTFY_URL, NTFY_TOPIC, NTFY_TOKEN                 ← never commit token
# See .env.example for full template.
#
# Depends on docker-socket-proxy (CONTAINERS=1, IMAGES=1) and traefik stacks being up.
# Compose folders are mounted read-only; their .env files are read only to resolve ${VAR} in image names.

name: image-updates

services:
  image-updates:
    image: ghcr.io/cravingpixels/image-update-dashboard:${UPDATES_VERSION:-latest}
    container_name: image-updates
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ}
      COMPOSE_DIRS: dockge=/stacks/dockge,komodo=/stacks/komodo
      GIT_REPOS: ${GIT_REPOS:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DOCKER_HOST: tcp://dockerproxy:2375
      SCAN_INTERVAL: ${UPDATES_SCAN_INTERVAL:-6h}
      PUBLIC_URL: https://${UPDATES_SUBDOMAIN}.${DOMAIN}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - updates_data:/data
      - ${DOCKGE_STACKS_DIR}:/stacks/dockge:ro
      - ${KOMODO_STACKS_DIR}:/stacks/komodo:ro
      # Uncomment to replace the bundled overrides with your own copy:
      # - ./overrides.yaml:/app/overrides.yaml:ro
    tmpfs:
      - /tmp
    networks:
      - traefik-net
      - docker-socket-proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-net
      traefik.http.routers.image-updates.entrypoints: https
      traefik.http.routers.image-updates.rule: Host(`${UPDATES_SUBDOMAIN}.${DOMAIN}`)
      traefik.http.routers.image-updates.tls: "true"
      traefik.http.routers.image-updates.tls.certresolver: cloudflare
      traefik.http.services.image-updates.loadbalancer.server.port: "8080"
      homepage.group: Infra
      homepage.name: ${UPDATES_NAME}
      homepage.icon: sh-docker.svg
      homepage.href: https://${UPDATES_SUBDOMAIN}.${DOMAIN}
      homepage.description: Container image updates
      kuma.enable: "true"
      kuma.image-updates.keyword.name: ${UPDATES_NAME}
      kuma.image-updates.keyword.url: https://${UPDATES_SUBDOMAIN}.${DOMAIN}/
      kuma.image-updates.keyword.keyword: Image Updates
    read_only: true
    mem_swappiness: 0
    deploy:
      # TODO: tune after profiling
      resources:
        limits:
          cpus: "0.50"
          memory: 256m
        reservations:
          cpus: "0.10"
          memory: 64m

networks:
  traefik-net:
    external: true
  docker-socket-proxy:
    external: true

volumes:
  updates_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${APP_DIR}/data
